<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معرض أعمال | Portfolio</title>
<meta name="description" content="معرض أعمال مصمم سوشيال ميديا وهويات بصرية وشعارات.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Readex+Pro:wght@300..700&display=swap" rel="stylesheet">
<style id="css">
:root,:root[data-theme="dark"]{
  --bg:#09060F; --bg-2:#0F0919; --surface:#140D22; --surface-2:#1C1232;
  --line:rgba(190,165,255,.14); --line-2:rgba(190,165,255,.28);
  --text:#F5F1FF; --muted:#A99CC8;
  --v1:#7C3AED; --v2:#9F67FF; --v3:#C4B5FD; --on-accent:#FFFFFF;
  --glow:rgba(124,58,237,.42); --shadow:0 40px 90px -40px rgba(0,0,0,.95);
  --f-display:'Bricolage Grotesque','Readex Pro',system-ui,sans-serif;
  --f-body:'Readex Pro',system-ui,'Segoe UI',Tahoma,sans-serif;
  --track:-0.03em; --dir:1;
  --pad:clamp(20px,5vw,72px); --maxw:1240px;
  --ease:cubic-bezier(.2,.7,.2,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#FAF8FF; --bg-2:#F1ECFF; --surface:#FFFFFF; --surface-2:#F4F0FF;
  --line:rgba(70,35,150,.12); --line-2:rgba(70,35,150,.26);
  --text:#150C2B; --muted:#5E5280;
  --v1:#6D28D9; --v2:#7C3AED; --v3:#5B21B6;
  --glow:rgba(124,58,237,.22); --shadow:0 40px 80px -46px rgba(60,30,130,.45);
  color-scheme:light;
}
html[lang="ar"]{--f-display:'Readex Pro','Bricolage Grotesque',system-ui,sans-serif;--track:-0.01em}
html[dir="rtl"]{--dir:-1}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px);-webkit-text-size-adjust:100%}
html:has(dialog[open]){overflow:hidden}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
svg{direction:ltr}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:1.0625rem;line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:clip;transition:background-color .45s,color .45s}
html[lang="ar"] body{line-height:1.9}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--f-display);letter-spacing:var(--track)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--v3);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;inset-inline-start:12px;top:-80px;z-index:90;background:var(--v1);color:var(--on-accent);padding:10px 16px;border-radius:10px;text-decoration:none}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}

/* ambient light */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1s ease}
.bgfx canvas.on{opacity:1}
.bgfx .pl{position:absolute;inset:0;will-change:transform}
.bgfx i{position:absolute;display:block;border-radius:50%;filter:blur(80px);will-change:transform}
.bgfx i:nth-child(1){width:56vmax;height:56vmax;top:-22vmax;inset-inline-end:-16vmax;background:var(--v1);opacity:.4;animation:drift1 24s ease-in-out infinite}
.bgfx i:nth-child(2){width:46vmax;height:46vmax;top:36vmax;inset-inline-start:-16vmax;background:var(--v3);opacity:.3;animation:drift2 30s ease-in-out infinite}
.bgfx i:nth-child(3){width:40vmax;height:40vmax;bottom:-16vmax;inset-inline-end:14vmax;background:var(--v2);opacity:.28;animation:drift3 34s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(calc(-6vmax * var(--dir)),7vmax) scale(1.14)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(calc(7vmax * var(--dir)),-6vmax) scale(1.1)}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(calc(-5vmax * var(--dir)),-7vmax) scale(1.16)}}
@media (prefers-reduced-motion:reduce){.bgfx i{animation:none}}
.wamid{position:relative;display:inline-flex;align-items:center;gap:.5em;font-size:.82rem;font-weight:600;padding:6px 14px 6px 12px;border-radius:999px;border:1px solid var(--line-2);color:var(--v3);background:color-mix(in srgb,var(--surface) 60%,transparent);overflow:hidden;isolation:isolate}
.wamid svg{flex:none;animation:tw 2.6s ease-in-out infinite}
.wamid::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.5) 48%,transparent 66%);transform:translateX(-120%);animation:shine 4.5s ease-in-out infinite}
:root[data-theme="light"] .wamid::after{background:linear-gradient(100deg,transparent 30%,rgba(124,58,237,.28) 48%,transparent 66%)}
@keyframes shine{0%,60%,100%{transform:translateX(-120%)}80%{transform:translateX(120%)}}
@keyframes tw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
@media (prefers-reduced-motion:reduce){.wamid::after{animation:none;display:none}.wamid svg{animation:none}}
main,footer{position:relative;z-index:1}

/* floating nav */
.nav-wrap{position:fixed;inset-inline:0;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:50;display:flex;justify-content:center;padding:0 12px;pointer-events:none}
.nav{pointer-events:auto;position:relative;display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:999px;background:color-mix(in srgb,var(--surface) 72%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line-2);box-shadow:0 18px 50px -24px rgba(0,0,0,.7);max-width:100%}
.brand{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 10px;text-decoration:none;font-family:var(--f-display);font-weight:700;letter-spacing:var(--track);white-space:nowrap}
.brand img{width:20px;height:auto;flex:none;display:block}
.links{display:flex;gap:2px}
.links a{text-decoration:none;font-size:.92rem;padding:8px 14px;border-radius:999px;color:var(--muted);transition:color .2s,background .2s}
.links a:hover,.links a[aria-current="true"]{color:var(--text);background:var(--surface-2)}
.ib{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;transition:background .2s,border-color .2s}
.ib:hover{background:var(--surface-2);border-color:var(--line-2)}
.lang{width:auto;padding:0 14px;border-radius:999px;font-size:.85rem;font-weight:600}
.menu-btn{display:none}
.menu{display:none}

/* buttons */
.btn{--mx:0px;--my:0px;display:inline-flex;align-items:center;justify-content:center;gap:.6em;font-weight:600;font-size:1rem;line-height:1.2;padding:15px 26px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--text);text-decoration:none;cursor:pointer;transform:translate(var(--mx),var(--my));transition:transform .25s var(--ease),background .25s,box-shadow .3s,border-color .25s}
.btn:hover{background:var(--surface-2)}
.btn.pri{border-color:transparent;color:var(--on-accent);background:linear-gradient(135deg,var(--v1),var(--v2));box-shadow:0 12px 40px -12px var(--glow),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.pri:hover{box-shadow:0 16px 56px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.34);background:linear-gradient(135deg,var(--v2),var(--v1))}
.btn.wh{background:#fff;color:#22104D;border-color:transparent}
.btn.wh:hover{background:#F0E9FF}
.btn.gh{color:#fff;border-color:rgba(255,255,255,.42)}
.btn.gh:hover{background:rgba(255,255,255,.14)}
.btn svg{flex:none}

/* hero */
.hero{position:relative;max-width:var(--maxw);margin:0 auto;padding:clamp(120px,15vw,170px) var(--pad) clamp(56px,8vw,110px);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(32px,5vw,80px);align-items:center}
.hero-wrap{position:relative;overflow:hidden}
.badge{display:inline-flex;align-items:center;gap:.7em;padding:7px 16px;border-radius:999px;border:1px solid var(--line-2);background:color-mix(in srgb,var(--surface) 70%,transparent);font-size:.88rem;color:var(--muted)}
.badge i{position:relative;width:8px;height:8px;border-radius:50%;background:#56E39F}
.badge i::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:1px solid #56E39F;opacity:0;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.6);opacity:0}}
h1{font-weight:700;font-size:clamp(2.3rem,4.9vw,4.5rem);line-height:1.06;margin:.4em 0 .38em;text-wrap:balance}
html[lang="ar"] h1{line-height:1.28;font-weight:600}
h1 .w{display:inline-block;overflow:hidden;vertical-align:top;padding:.1em 0 .16em;margin:-.1em 0 -.16em}
h1 .w>span{display:inline-block;transform:translateY(112%);transition:transform 1s var(--ease);transition-delay:calc(var(--i)*70ms + 150ms)}
h1.go .w>span{transform:none}
h1.instant .w>span{transition:none}
.lead{font-size:clamp(1.05rem,1.5vw,1.22rem);color:var(--muted);max-width:32em}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}

.portrait{position:relative;justify-self:center;width:100%;max-width:420px}
.pcard{position:relative}
.pcard img{display:block;width:100%;height:auto;filter:drop-shadow(0 40px 70px var(--glow)) drop-shadow(0 18px 34px rgba(0,0,0,.5));transform:translate(calc(var(--px,0)*-8px),calc(var(--py,0)*-5px));transition:transform .5s var(--ease);user-select:none;-webkit-user-drag:none}
.fchip{position:absolute;z-index:3;display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:999px;font-size:.88rem;font-weight:500;background:color-mix(in srgb,var(--surface) 76%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line-2);box-shadow:0 18px 40px -18px rgba(0,0,0,.6);animation:float 7s ease-in-out infinite;animation-delay:var(--d,0s);white-space:nowrap}
.fchip i{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--v1),var(--v3))}
.fchip.a{top:9%;inset-inline-start:-7%}
.fchip.b{top:44%;inset-inline-end:-6%;--d:-2.3s}
.fchip.c{bottom:9%;inset-inline-start:-4%;--d:-4.6s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

/* marquee */
.marq{border-block:1px solid var(--line);overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);background:color-mix(in srgb,var(--bg-2) 60%,transparent)}
.track{display:flex;width:max-content;animation:slide 44s linear infinite}
@keyframes slide{to{transform:translateX(calc((-100% / var(--rep,6)) * var(--dir)))}}
.mi{display:flex;align-items:center;gap:clamp(24px,4vw,48px);padding:22px clamp(12px,2vw,24px);font-family:var(--f-display);font-weight:600;font-size:clamp(1.2rem,2.4vw,1.8rem);color:var(--muted);white-space:nowrap;letter-spacing:var(--track)}
.mi svg{color:var(--v2);flex:none}

/* sections */
.sec{position:relative;max-width:var(--maxw);margin:0 auto;padding:clamp(72px,10vw,140px) var(--pad)}
.sh{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:24px 40px;margin-bottom:clamp(32px,4.5vw,60px)}
h2{font-weight:700;font-size:clamp(2rem,4.4vw,3.5rem);line-height:1.1;text-wrap:balance}
html[lang="ar"] h2{line-height:1.3;font-weight:600}
.note{color:var(--muted);margin-top:.7em;max-width:34em;font-size:1rem}

/* filter */
.seg{position:relative;display:inline-flex;flex-wrap:wrap;gap:2px;padding:4px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.seg-ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:linear-gradient(135deg,var(--v1),var(--v2));box-shadow:0 8px 24px -10px var(--glow);transition:transform .45s var(--ease),width .45s var(--ease);z-index:0}
.seg button{position:relative;z-index:1;border:0;background:none;padding:9px 18px;border-radius:999px;font-size:.92rem;color:var(--muted);cursor:pointer;transition:color .25s}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{color:var(--on-accent);font-weight:600}

/* gallery */
.gal{columns:3 300px;column-gap:20px}
.card{break-inside:avoid;margin:0 0 20px;position:relative;border-radius:24px;overflow:hidden;background:var(--surface);border:1px solid var(--line);transition:border-color .3s,box-shadow .4s,transform .9s var(--ease),opacity .9s var(--ease)}
.card:hover{border-color:var(--line-2);box-shadow:0 30px 70px -36px var(--glow)}
.card-btn{display:block;position:relative;width:100%;padding:0;border:0;background:none;cursor:pointer;text-align:start;overflow:hidden}
.media{display:block;aspect-ratio:var(--ar)}
.media img,.media svg{display:block;width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.card:hover .media img,.card:hover .media svg{transform:scale(1.045)}
.card::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(360px circle at var(--mx,50%) var(--my,50%),rgba(196,181,253,.2),transparent 45%);opacity:0;transition:opacity .35s}
.card:hover::after{opacity:1}
.cap{position:absolute;inset-inline:0;bottom:0;display:flex;justify-content:space-between;align-items:end;gap:12px;padding:44px 18px 16px;background:linear-gradient(180deg,transparent,rgba(9,6,15,.82));color:#fff;opacity:0;transform:translateY(10px);transition:opacity .4s var(--ease),transform .5s var(--ease)}
.card:hover .cap,.card-btn:focus-visible .cap{opacity:1;transform:none}
@media (hover:none){.cap{opacity:1;transform:none}}
.cap-t{font-family:var(--f-display);font-weight:600;font-size:1.05rem;line-height:1.3}
.cap-c{font-size:.8rem;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);white-space:nowrap}
.tag{position:absolute;top:12px;inset-inline-start:12px;z-index:2;font-size:.75rem;padding:3px 10px;border-radius:999px;background:rgba(9,6,15,.62);color:#DCCFFF;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(196,181,253,.3)}
.empty{color:var(--muted);padding:40px 0}

/* showcase carousel */
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.views{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.views button{width:38px;height:38px;border-radius:50%;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:background .25s,color .25s}
.views button:hover{color:var(--text)}
.views button[aria-pressed="true"]{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.show{position:relative}
.stage{--sh:clamp(400px,40vw,600px);position:relative;height:var(--sh);width:100vw;margin-inline:calc(50% - 50vw);overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10%,#000 90%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 10%,#000 90%,transparent 100%)}
.stage.none{height:auto;-webkit-mask-image:none;mask-image:none}
.sl{position:absolute;left:50%;top:50%;transform-origin:center;transition:transform 1s var(--ease),opacity .8s ease;will-change:transform,opacity}
.lamp{position:absolute;left:50%;top:-34px;transform:translateX(-50%);width:26px;height:26px;color:var(--muted);opacity:.5;z-index:4;pointer-events:none;transition:color .7s var(--ease),opacity .7s var(--ease),filter .7s var(--ease)}
.lamp svg{display:block;width:100%;height:100%}
.lamp .glass{transition:fill .7s var(--ease)}
.sl.act .lamp{color:#FFEBB0;opacity:1;filter:drop-shadow(0 0 10px rgba(255,225,140,.9)) drop-shadow(0 0 26px rgba(255,215,120,.55))}
.sl.act .lamp .glass{fill:rgba(255,232,160,.45)}
@media (prefers-reduced-motion:reduce){.lamp{transition:none}}
.notr .sl{transition:none!important}
.sl.off{pointer-events:none}
.sl-btn{position:relative;display:block;width:100%;height:100%;padding:0;border:1px solid var(--line);border-radius:34px;overflow:hidden;background:var(--surface);cursor:pointer;box-shadow:0 26px 60px -34px rgba(0,0,0,.9);transition:box-shadow .8s ease,border-color .8s ease}
.sl-btn::before{content:'';position:absolute;inset:0 0 auto 0;height:52%;background:linear-gradient(180deg,rgba(255,228,158,.4),rgba(255,228,158,0) 100%);opacity:0;transition:opacity .9s var(--ease);pointer-events:none;z-index:3}
.sl.act .sl-btn::before{opacity:1}
.sl.act .sl-btn{cursor:zoom-in;border-color:var(--line-2);box-shadow:0 40px 90px -34px var(--glow),0 24px 50px -30px rgba(0,0,0,.9)}
.sl .media{height:100%;aspect-ratio:auto}
.sl .media img,.sl .media svg{width:100%;height:100%;object-fit:cover;filter:brightness(.4) saturate(.7);transition:filter 1s var(--ease)}
.sl.side .media img,.sl.side .media svg{filter:brightness(.6) saturate(.85)}
.sl.act .media img,.sl.act .media svg{filter:brightness(1.08) saturate(1.08)}
.sl:hover .media img,.sl:hover .media svg{transform:none}
.veil{position:absolute;inset:0;background:var(--bg);opacity:0;transition:opacity .8s ease;pointer-events:none}
.sl.side .veil{opacity:.2}
.sl.act .sl-btn{box-shadow:0 40px 90px -34px var(--glow),0 24px 50px -30px rgba(0,0,0,.9),0 0 60px -10px var(--glow)}
.sl .tag{top:14px;inset-inline-start:14px}
.ctrl{display:flex;align-items:center;justify-content:center;gap:14px;direction:ltr;margin-top:22px}
.ib.big{width:48px;height:48px}
.prog{position:relative;flex:1;max-width:300px;height:3px;border-radius:3px;background:var(--line-2);overflow:hidden}
.prog i{position:absolute;inset:0;transform:scaleX(0);transform-origin:left center;background:linear-gradient(90deg,var(--v1),var(--v3))}
.prog.run i{animation:prog var(--iv,4200ms) linear forwards}
.prog.paused i{animation-play-state:paused}
@keyframes prog{to{transform:scaleX(1)}}
.cnt{min-width:4.8em;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;direction:ltr}

/* services */
.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:20px}
.bc{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);padding:clamp(24px,3vw,36px);display:flex;flex-direction:column;gap:14px;transition:border-color .3s,box-shadow .4s}
.bc:hover{border-color:var(--line-2);box-shadow:0 30px 70px -40px var(--glow)}
.bc::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(159,103,255,.14),transparent 45%);opacity:0;transition:opacity .35s}
.bc:hover::after{opacity:1}
.b1{grid-column:span 3;grid-row:span 2;border-radius:36px}
.b2{grid-column:span 3;border-radius:26px}
.b3{grid-column:span 3;border-radius:26px}
.bart{flex:1;min-height:150px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(160deg,var(--surface-2),var(--bg-2));border:1px solid var(--line);overflow:hidden}
.b1 .bart{min-height:280px}
.bart svg{width:min(100%,460px);height:auto;max-height:340px}
.bc h3{font-size:clamp(1.3rem,2.2vw,1.65rem);font-weight:700;line-height:1.25}
html[lang="ar"] .bc h3{font-weight:600}
.bc p{color:var(--muted);font-size:.98rem;max-width:34em}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.tags span{font-size:.82rem;padding:5px 13px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted)}

/* process */
.steps{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(20px,3vw,40px);padding-top:8px}
.rail{position:absolute;top:26px;inset-inline:0;height:2px;background:var(--line)}
.rail i{position:absolute;inset-block:0;inset-inline-start:0;width:calc(var(--p,0)*100%);background:linear-gradient(90deg,var(--v1),var(--v3));border-radius:2px}
.step{position:relative;padding-top:56px}
.dot{position:absolute;top:8px;inset-inline-start:0;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:.9rem;background:var(--bg);border:2px solid var(--line-2);color:var(--muted);transition:background .5s,border-color .5s,color .5s,box-shadow .5s}
.step.on .dot{background:linear-gradient(135deg,var(--v1),var(--v2));border-color:transparent;color:var(--on-accent);box-shadow:0 0 0 6px color-mix(in srgb,var(--v1) 22%,transparent)}
.step h3{font-size:1.25rem;font-weight:700;margin-bottom:8px}
html[lang="ar"] .step h3{font-weight:600}
.step p{color:var(--muted);font-size:.96rem}

/* about */
.about{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.6fr);gap:clamp(28px,6vw,96px)}
.big{font-family:var(--f-display);font-size:clamp(1.5rem,3vw,2.4rem);line-height:1.4;font-weight:500;letter-spacing:var(--track);text-wrap:balance}
html[lang="ar"] .big{line-height:1.7}
.facts{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr);margin:36px 0 0;border-top:1px solid var(--line)}
.facts dt,.facts dd{margin:0;padding:15px 0;border-bottom:1px solid var(--line)}
.facts dt{color:var(--muted);font-size:.95rem}

/* contact */
.cta{position:relative;overflow:hidden;border-radius:44px;padding:clamp(40px,8vw,104px) clamp(22px,5vw,72px);text-align:center;color:#fff;background:linear-gradient(140deg,#4C1D95,#7C3AED 55%,#9F67FF);box-shadow:0 60px 120px -50px var(--glow)}
.cta::before,.cta::after{content:'';position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.2);pointer-events:none}
.cta::before{width:520px;height:520px;inset-inline-start:-160px;top:-260px}
.cta::after{width:680px;height:680px;inset-inline-end:-260px;bottom:-420px}
.cta>*{position:relative;z-index:1}
.cta h2{font-size:clamp(2.2rem,6.4vw,5rem);line-height:1.05;margin-bottom:.4em}
html[lang="ar"] .cta h2{line-height:1.25}
.cta p{color:rgba(255,255,255,.82);max-width:30em;margin:0 auto}
.cta .btns{justify-content:center}
#soc:empty{display:none}
.soc{list-style:none;margin:0 0 22px;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.soc a{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid var(--line-2);color:var(--muted);transition:color .2s,border-color .2s,background .2s,transform .25s var(--ease)}
.soc a:hover{color:var(--text);border-color:transparent;background:linear-gradient(135deg,var(--v1),var(--v2));transform:translateY(-3px)}
.hint{margin-top:28px;font-size:.92rem;color:rgba(255,255,255,.75)}
footer{max-width:var(--maxw);margin:0 auto;padding:28px var(--pad) 48px;border-top:1px solid var(--line)}
.fbot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;color:var(--muted);font-size:.9rem}
.fbot a{text-decoration:none}
.fbot a:hover{color:var(--text)}
footer a:hover{color:var(--text)}

/* reveal */
.rv{opacity:0;transform:translateY(24px)}
.rv.in{opacity:1;transform:none}
.rv,.card.rv,.bc.rv{transition:opacity .9s var(--ease) calc(var(--i,0)*70ms),transform .9s var(--ease) calc(var(--i,0)*70ms)}
.hero .rv{transition-delay:calc(var(--i,0)*90ms + 350ms)}

/* lightbox */
dialog{padding:0;border:0;color:var(--text);background:transparent;max-width:none;max-height:none}
dialog::backdrop{background:rgba(6,3,14,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.lb{width:min(96vw,1180px);max-height:94dvh;margin:auto;overflow:auto;border-radius:28px;background:var(--surface);border:1px solid var(--line-2);animation:pop .5s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(14px)}}
.lb-in{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);min-height:0}
.stage{position:relative;display:grid;place-items:center;padding:clamp(14px,2.5vw,32px);background:var(--bg-2)}
.frame{width:min(100%,calc(74dvh * var(--ar)));aspect-ratio:var(--ar);border-radius:16px;overflow:hidden;background:var(--surface-2)}
.frame img,.frame svg{display:block;width:100%;height:100%;object-fit:cover}
.arr{position:absolute;top:50%;transform:translateY(-50%);z-index:2;background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.arr.prev{inset-inline-start:14px}.arr.next{inset-inline-end:14px}
html[dir="rtl"] .flip{transform:scaleX(-1)}
.lb-body{padding:clamp(22px,3.4vw,44px);display:flex;flex-direction:column;gap:14px}
.lb-meta{display:flex;align-items:center;gap:12px}
.lb-yr{color:var(--muted);font-size:.9rem}
.lb-cat{display:inline-flex;font-size:.82rem;padding:5px 14px;border-radius:999px;border:1px solid var(--line-2);color:var(--v3)}
.lb-body h3{font-size:clamp(1.6rem,3vw,2.3rem);font-weight:700;line-height:1.15}
html[lang="ar"] .lb-body h3{font-weight:600;line-height:1.35}
.lb-body p{color:var(--muted)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs button{width:56px;height:56px;padding:0;border-radius:12px;overflow:hidden;border:2px solid transparent;background:var(--surface-2);cursor:pointer;opacity:.6;transition:opacity .2s,border-color .2s}
.thumbs button[aria-current="true"]{opacity:1;border-color:var(--v2)}
.thumbs img,.thumbs svg{width:100%;height:100%;object-fit:cover;display:block}
.lb-nav{margin-top:auto;display:flex;gap:10px;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--line)}
.lb-nav .btn{padding:11px 18px;font-size:.92rem}
.lb-x{position:absolute;top:12px;inset-inline-end:12px;z-index:5;background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

@media (max-width:980px){
  .hero{grid-template-columns:1fr}
  .portrait{max-width:300px;order:-1;margin-top:-8px}
  .fchip.a{inset-inline-start:-3%}.fchip.b{inset-inline-end:-3%}.fchip.c{inset-inline-start:-1%}
  .about{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr;padding-top:0;padding-inline-start:8px}
  .rail{top:0;bottom:0;inset-inline:auto;inset-inline-start:25px;width:2px;height:auto}
  .rail i{inset:0 auto auto 0;width:100%;height:calc(var(--p,0)*100%)}
  .step{padding:0;padding-inline-start:60px;min-height:70px}
  .dot{top:0}
  .lb-in{grid-template-columns:1fr}
  .frame{width:min(100%,calc(58dvh * var(--ar)))}
}
@media (max-width:760px){
  .links{display:none}
  .menu-btn{display:grid}
  .menu{position:absolute;top:calc(100% + 8px);inset-inline:0;padding:8px;border-radius:24px;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line-2);flex-direction:column}
  .menu.open{display:flex}
  .menu a{padding:13px 16px;text-decoration:none;border-radius:16px}
  .menu a:hover{background:var(--surface-2)}
  .nav{width:100%;max-width:520px}
  .brand{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .bento{grid-template-columns:1fr}
  .b1,.b2,.b3{grid-column:auto;grid-row:auto}
  .gal{columns:2 150px;column-gap:12px}
  .card{margin-bottom:12px;border-radius:18px}
  .cap{padding:34px 12px 10px}.cap-t{font-size:.9rem}.cap-c{display:none}
}
@media (max-width:420px){.gal{columns:1}}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rv,.card{opacity:1!important;transform:none!important;transition:none!important}
  h1 .w>span{transform:none!important;transition:none!important}
  .track,.fchip,.badge i::after{animation:none!important}
  .btn,.pcard img{transition:none}
  .sl,.veil,.sl-btn{transition-duration:.01s!important}
  .prog i{animation:none!important}
}
</style>
</head>

function buildShow(list,preserve){

function layoutShow(instant){
  var st=$('#stage');if(!st||!ring.length||st.offsetParent===null)return;
  var W=st.clientWidth,Hs=st.clientHeight*.78,mob=W<700;
  var maxW=W*(mob?.7:.46),gap=Math.max(14,Math.min(30,W*.022)),N=ring.length;
  var ws=[],hs=[];
  ring.forEach(function(d){var r=ratio(d),w=Math.min(Hs*r,maxW);ws.push(w);hs.push(w/r);});
  var sc=function(k){return k===0?1:Math.abs(k)===1?(mob?.74:.8):.6;};
  var kk=ring.map(function(_,i){var k=((i-ai)%N+N)%N;if(k>N/2)k-=N;return k;});
  var byK={},kmin=0,kmax=0;kk.forEach(function(k,i){byK[k]=i;if(k<kmin)kmin=k;if(k>kmax)kmax=k;});
  var X=new Array(N).fill(0),edge,k;
  edge=ws[byK[0]]/2;
  for(k=1;k<=kmax;k++){var wr=ws[byK[k]]*sc(k);X[byK[k]]=edge+gap+wr/2;edge+=gap+wr;}
  edge=-ws[byK[0]]/2;
  for(k=-1;k>=kmin;k--){var wl=ws[byK[k]]*sc(k);X[byK[k]]=edge-gap-wl/2;edge-=gap+wl;}
  if(instant){st.classList.add('notr');}
  $$('.sl',st).forEach(function(el,i){
    var kx=kk[i],a=Math.abs(kx);
    el.style.width=ws[i].toFixed(1)+'px';el.style.height=hs[i].toFixed(1)+'px';
    el.style.transform='translate(-50%,-50%) translateX('+X[i].toFixed(1)+'px) scale('+sc(kx)+')';
    el.style.opacity=kx===0?1:(a===1?(mob?.5:.55):0);

/* ================= living background: starfield + scroll parallax ================= */
function initBg(){
  var canvas=$('#stars'),parallax=$('#parallax');
  if(!canvas||!parallax)return;
  var ctx=canvas.getContext&&canvas.getContext('2d');
  if(!ctx)return;
  var W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1),stars=[],raf=null,mx=-9999,my=-9999,scrollY=0,active=false;
  function starColor(){return theme==='dark'?'255,255,255':'80,60,150';}
  function count(){return Math.round(Math.min(140,Math.max(50,(W*H)/16000)));}
  function build(){
    var n=count();stars=[];
    for(var i=0;i<n;i++){
      stars.push({
        hx:Math.random()*W,hy:Math.random()*H,
        x:0,y:0,r:Math.random()*1.4+.4,
        phase:Math.random()*Math.PI*2,speed:.4+Math.random()*.6,
        vx:(Math.random()-.5)*.16,vy:(Math.random()-.5)*.16-.06,
        dx:0,dy:0
      });
    }
  }
  function resize(){
    W=window.innerWidth;H=window.innerHeight;
    canvas.width=W*DPR;canvas.height=H*DPR;
    canvas.style.width=W+'px';canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    build();
  }
  function setActive(on){
    active=on;canvas.classList.toggle('on',on);
    if(on&&!raf)raf=requestAnimationFrame(tick);
    if(!on&&raf){cancelAnimationFrame(raf);raf=null;ctx.clearRect(0,0,W,H);}
  }
  var last=0;
  function tick(ts){
    raf=requestAnimationFrame(tick);
    if(ts-last<33)return; // ~30fps, plenty smooth for a quiet starfield
    last=ts;
    ctx.clearRect(0,0,W,H);
    var col=starColor(),t=ts/1000,drift=(scrollY*.14)%H;
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      s.hx+=s.vx;s.hy+=s.vy;
      if(s.hx<0)s.hx+=W;if(s.hx>W)s.hx-=W;
      var by=(s.hy-drift)%H;if(by<0)by+=H;
      if(s.hy<0)s.hy+=H;if(s.hy>H)s.hy-=H;
      var tx=s.hx,ty=by;
      if(mx>-9000){
        var ddx=tx-mx,ddy=ty-my,dist=Math.sqrt(ddx*ddx+ddy*ddy),rad=90;
        if(dist<rad&&dist>.1){var f=(1-dist/rad)*26;s.dx+=(ddx/dist*f-s.dx)*.18;s.dy+=(ddy/dist*f-s.dy)*.18;}
        else{s.dx*=.9;s.dy*=.9;}
      }else{s.dx*=.9;s.dy*=.9;}
      var px=tx+s.dx,py=ty+s.dy;
      var a=.35+.45*(Math.sin(t*s.speed+s.phase)*.5+.5);
      ctx.beginPath();ctx.fillStyle='rgba('+col+','+a.toFixed(2)+')';
      ctx.arc(px,py,s.r,0,Math.PI*2);ctx.fill();
    }
  }
  window.addEventListener('resize',function(){clearTimeout(window.__srz);window.__srz=setTimeout(resize,150);});
  document.addEventListener('pointermove',function(e){mx=e.clientX;my=e.clientY;});
  document.addEventListener('pointerleave',function(){mx=my=-9999;});
  function onScroll(){scrollY=window.scrollY||window.pageYOffset||0;parallax.style.transform='translateY('+(scrollY*-.22).toFixed(1)+'px)';}
  window.addEventListener('scroll',function(){if(!bgTicking){bgTicking=true;requestAnimationFrame(function(){bgTicking=false;onScroll();});}},{passive:true});
  document.addEventListener('visibilitychange',function(){refreshBg();});
  resize();onScroll();refreshBg();
  window.__refreshBg=refreshBg;
  function refreshBg(){setActive(theme==='dark'&&!reduce&&!document.hidden);}
}
var bgTicking=false;

/* ================= start ================= */
$('#root').innerHTML=shell();
bind();bindLb();
paintAll(true);
watch(document);
initBg();
})();
</script>
